# =========================
#       H2 Test Database
# =========================

# jdbc:h2:mem:erp_test: 메모리에 erp_test라는 테스트용 임시 DB를 생성
# MODE=Oracle: H2가 일부 SQL 문법을 Oracle 호환 방식으로 처리
# DB_CLOSE_DELAY=-1: 테스트 중 DB 연결이 잠시 끊겨도 메모리 DB를 유지
# DB_CLOSE_ON_EXIT=FALSE: JVM 종료 시 H2가 직접 DB를 닫지 않고 Spring이 종료를 관리
spring.datasource.url=jdbc:h2:mem:erp_test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# H2 테스트 DB의 기본 관리자 아이디
spring.datasource.username=sa

# 메모리에서만 사용하는 테스트 DB이므로 비밀번호를 사용하지 않음
spring.datasource.password=

# H2 데이터베이스 연결에 사용할 JDBC 드라이버
spring.datasource.driver-class-name=org.h2.Driver


# =========================
#       JPA Test
# =========================

# create-drop: 테스트 시작 시 Entity를 기준으로 테이블을 생성하고 테스트 종료 시 제거
spring.jpa.hibernate.ddl-auto=create-drop

# 테스트 실행 중 Hibernate SQL을 콘솔에 출력하지 않음
spring.jpa.show-sql=false

# SQL을 출력하지 않으므로 SQL 정렬 기능도 사용하지 않음
spring.jpa.properties.hibernate.format_sql=false


# =========================
# 		Test Logging
# =========================

# 테스트 실행 로그가 일반 서버의 logs 폴더에 섞이지 않도록 build 폴더에 별도로 저장
logging.file.name=build/test-logs/erp-server-test.log