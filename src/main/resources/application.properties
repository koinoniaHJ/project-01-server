spring.application.name=erp-server

# 기본 실행 환경을 local 프로필로 지정
# spring.profiles.active=local
# 별도 프로필이 지정되지 않은 일반 실행에서는 local 프로필을 기본으로 사용
spring.profiles.default=local


# =========================
#		JPA
# =========================
# validate: Entity와 실제 DB 테이블 구조가 일치하는지 서버 시작 시 검증
# 테이블을 자동 생성하거나 수정하지 않음
spring.jpa.hibernate.ddl-auto=validate

# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true

# 출력되는 SQL을 보기 좋게 줄바꿈/정렬
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Logging
# =========================
# %X{traceId}: MDC에서 traceId 값을 꺼내 각 로그의 레벨 앞에 표시
# %5p: TRACE, DEBUG, INFO, WARN, ERROR 등의 로그 레벨을 다섯 칸 너비로 표시
logging.pattern.level=traceId:%X{traceId} %5p

# 콘솔뿐 아니라 프로젝트의 logs/erp-server.log 파일에도 서버 로그를 저장
logging.file.name=logs/erp-server.log


# ========== Gmail SMTP ==========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${ERP_SMTP_USERNAME}
spring.mail.password=${ERP_SMTP_APP_PASSWORD}
spring.mail.default-encoding=UTF-8

# ========== SMTP 인증 및 TLS ==========
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ========== SMTP 연결 제한 시간 ==========
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========== ERP 이메일 발신자 ==========
erp.mail.from=${ERP_SMTP_FROM}

# ========== 발주서 PDF 한글 글꼴 ==========
erp.document.font-path=${ERP_DOCUMENT_FONT_PATH:C:/Windows/Fonts/NotoSansKR-VF.ttf}